<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Diagnóstico | Partum Design</title>
    <meta name="description" content="Herramienta de diagnóstico y auditoría integral: Branding, Desarrollo (web, apps, ERP, CRM y plataformas a la medida), Operaciones y Redes Sociales.">
    <meta name="theme-color" content="#0c0a1f">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/app.js"></script>
</head>

<body>
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="app">
        <!-- ===== Sidebar ===== -->
        <aside class="sidebar" id="sidebar">
            <a class="brand" href="#/inicio" aria-label="Inicio">
                <span class="brand-text" id="brandText"><b>PARTUM</b> DESIGN</span>
                <small>Herramienta de diagnóstico</small>
            </a>

            <button class="client-switch" id="clientSwitch" type="button">
                <span class="client-avatar" id="clientAvatar">N</span>
                <span class="client-meta"><small>Auditoría de</small><strong id="clientName">Nueva auditoría</strong></span>
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </button>

            <button class="search-trigger" id="searchTrigger" type="button">
                <i class="fa-solid fa-magnifying-glass"></i><span>Buscar pregunta…</span><kbd>Ctrl K</kbd>
            </button>

            <nav class="nav" id="nav" aria-label="Secciones"></nav>

            <div class="sidebar-foot">
                <div class="save-state" id="saveState"><i class="fa-solid fa-circle-check"></i><span>Todo guardado</span></div>
                <div class="foot-actions">
                    <button class="btn btn-ghost btn-sm" id="backupBtn" type="button" title="Descargar respaldo (.json)"><i class="fa-solid fa-download"></i></button>
                    <button class="btn btn-primary" id="exportBtn" type="button"><i class="fa-solid fa-file-pdf"></i> Exportar PDF</button>
                </div>
            </div>
        </aside>

        <!-- ===== Main ===== -->
        <main class="main" id="main">
            <header class="topbar">
                <div class="crumbs" id="crumbs"></div>
                <div class="global-progress" id="globalProgress" title="Progreso general">
                    <svg viewBox="0 0 36 36" class="ring"><circle cx="18" cy="18" r="15.5" class="ring-bg" /><circle cx="18" cy="18" r="15.5" class="ring-fg" id="globalRing" /></svg>
                    <span id="globalPct">0%</span>
                </div>
            </header>
            <div class="view" id="view" tabindex="-1"></div>
        </main>
    </div>

    <!-- ===== Mobile bottom nav ===== -->
    <nav class="bottom-nav" aria-label="Navegación móvil">
        <a href="#/inicio" data-m="inicio"><i class="fa-solid fa-house"></i><span>Inicio</span></a>
        <button type="button" data-m="sections"><i class="fa-solid fa-list-check"></i><span>Secciones</span></button>
        <button type="button" data-m="search"><i class="fa-solid fa-magnifying-glass"></i><span>Buscar</span></button>
        <a href="#/resumen" data-m="resumen"><i class="fa-solid fa-chart-pie"></i><span>Resumen</span></a>
    </nav>

    <!-- ===== Sheet (mobile sections) ===== -->
    <div class="sheet" id="sheet" aria-hidden="true">
        <div class="sheet-backdrop" data-close></div>
        <div class="sheet-panel" role="dialog" aria-label="Secciones">
            <div class="sheet-grip" data-close></div>
            <div class="sheet-body" id="sheetBody"></div>
        </div>
    </div>

    <!-- ===== Command palette ===== -->
    <div class="palette" id="palette" aria-hidden="true">
        <div class="palette-backdrop" data-close></div>
        <div class="palette-box" role="dialog" aria-label="Buscar">
            <div class="palette-input"><i class="fa-solid fa-magnifying-glass"></i><input id="paletteInput" type="text" placeholder="Buscar pregunta, sección o respuesta…" autocomplete="off"><kbd>Esc</kbd></div>
            <div class="palette-results" id="paletteResults"></div>
        </div>
    </div>

    <!-- ===== Modal ===== -->
    <div class="modal" id="modal" aria-hidden="true">
        <div class="modal-backdrop" data-close></div>
        <div class="modal-box" role="dialog" aria-modal="true" id="modalBox"></div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <input type="file" id="importInput" accept=".json,application/json" hidden>
</body>

</html>
